<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>CEA Task Board</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>

    /* =========================================
       GLOBAL
    ========================================= */

    :root {
      --bg: #f5f7fb;
      --white: #ffffff;

      --text: #172033;
      --muted: #667085;

      --border: #e3e8f0;

      --primary: #2563eb;
      --primary-2: #4f46e5;

      --danger: #b42318;

      --radius: 18px;

      --shadow:
        0 15px 45px rgba(15, 23, 42, 0.07);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        "Manrope",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 10% 0%,
          rgba(37, 99, 235, 0.10),
          transparent 30rem
        ),
        radial-gradient(
          circle at 90% 10%,
          rgba(79, 70, 229, 0.08),
          transparent 28rem
        ),
        var(--bg);
    }


    /* =========================================
       IMPORTANT FIX
       
       Makes sure hidden HTML elements REALLY
       stay hidden.
    ========================================= */

    [hidden] {
      display: none !important;
    }


    /* =========================================
       SUBTLE BACKGROUND GRID
    ========================================= */

    body::before {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;

      background-image:
        linear-gradient(
          rgba(15, 23, 42, 0.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(15, 23, 42, 0.025) 1px,
          transparent 1px
        );

      background-size: 32px 32px;

      mask-image:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.7),
          transparent 85%
        );
    }


    /* =========================================
       TOP BAR
    ========================================= */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;

      height: 76px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 clamp(20px, 5vw, 70px);

      background: rgba(255, 255, 255, 0.82);

      border-bottom: 1px solid rgba(227, 232, 240, 0.9);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }


    .topbar h1 {
      margin: 0;

      display: flex;
      align-items: center;

      gap: 11px;

      font-size: 21px;
      font-weight: 800;

      letter-spacing: -0.6px;
    }


    .topbar h1::before {
      content: "✓";

      width: 36px;
      height: 36px;

      display: grid;
      place-items: center;

      color: white;

      font-size: 17px;
      font-weight: 800;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--primary-2)
        );

      border-radius: 11px;

      box-shadow:
        0 8px 20px rgba(37, 99, 235, 0.22);
    }


    .userbar {
      display: flex;
      align-items: center;

      gap: 14px;
    }


    #user-name {
      color: #475467;

      font-size: 14px;
      font-weight: 700;
    }


    /* =========================================
       MAIN
    ========================================= */

    main {
      width: min(1180px, calc(100% - 32px));

      margin: 0 auto;

      padding: 42px 0 70px;
    }


    /* =========================================
       AUTH CARD
    ========================================= */

    .auth {
      width: min(450px, 100%);

      margin: 8vh auto 0;

      padding: 32px;

      background:
        rgba(255, 255, 255, 0.94);

      border: 1px solid var(--border);

      border-radius: 24px;

      box-shadow: var(--shadow);
    }


    /* =========================================
       LOGIN TABS
    ========================================= */

    .auth-tabs {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 5px;

      padding: 5px;

      margin-bottom: 22px;

      background: #f1f4f8;

      border-radius: 13px;
    }


    .tab {
      border: none;

      padding: 11px 12px;

      border-radius: 9px;

      background: transparent;

      color: var(--muted);

      font-family: inherit;
      font-size: 13px;
      font-weight: 700;

      cursor: pointer;

      transition: all 0.2s ease;
    }


    .tab:hover {
      color: var(--text);
    }


    .tab.is-active {
      color: var(--text);

      background: white;

      box-shadow:
        0 2px 8px rgba(15, 23, 42, 0.08);
    }


    /* =========================================
       BOARD LAYOUT
    ========================================= */

    .board {
      display: grid;

      grid-template-columns: 330px minmax(0, 1fr);

      gap: 26px;

      align-items: start;
    }


    /* =========================================
       TASK FORM PANEL
    ========================================= */

    .panel {
      position: sticky;
      top: 102px;

      padding: 25px;

      background:
        rgba(255, 255, 255, 0.94);

      border: 1px solid var(--border);

      border-radius: var(--radius);

      box-shadow: var(--shadow);
    }


    .panel h2 {
      margin: 0 0 23px;

      font-size: 21px;
      font-weight: 800;

      letter-spacing: -0.5px;
    }


    /* =========================================
       FORM
    ========================================= */

    .form {
      display: grid;

      gap: 16px;
    }


    label {
      display: grid;

      gap: 7px;

      color: #344054;

      font-size: 12px;
      font-weight: 800;
    }


    input,
    textarea,
    select {
      width: 100%;

      padding: 12px 13px;

      color: var(--text);

      background: #fbfcfe;

      border: 1px solid #dce2ea;

      border-radius: 12px;

      outline: none;

      font-family: inherit;
      font-size: 13px;
      font-weight: 500;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }


    textarea {
      min-height: 100px;

      resize: vertical;
    }


    input:hover,
    textarea:hover,
    select:hover {
      border-color: #c7d0dd;
    }


    input:focus,
    textarea:focus,
    select:focus {
      background: white;

      border-color: #7aa2f7;

      box-shadow:
        0 0 0 4px rgba(37, 99, 235, 0.10);
    }


    .hint {
      margin: -8px 0 0;

      color: #98a2b3;

      font-size: 11px;

      line-height: 1.5;
    }


    /* =========================================
       BUTTONS
    ========================================= */

    .row {
      display: flex;

      align-items: center;

      gap: 9px;

      margin-top: 2px;
    }


    .btn {
      border: none;

      padding: 11px 16px;

      border-radius: 11px;

      font-family: inherit;

      font-size: 12px;
      font-weight: 800;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }


    .btn-primary {
      color: white;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--primary-2)
        );

      box-shadow:
        0 8px 18px rgba(37, 99, 235, 0.20);
    }


    .btn-primary:hover {
      transform: translateY(-1px);

      box-shadow:
        0 11px 24px rgba(37, 99, 235, 0.27);
    }


    .btn-primary:active {
      transform: translateY(0);
    }


    .btn-quiet {
      color: #475467;

      background: #f2f4f7;
    }


    .btn-quiet:hover {
      background: #e9edf2;
    }


    /* =========================================
       RIGHT TASK AREA
    ========================================= */

    .list-area {
      min-height: 520px;

      padding: 25px;

      background:
        rgba(255, 255, 255, 0.78);

      border: 1px solid var(--border);

      border-radius: var(--radius);

      box-shadow:
        0 12px 38px rgba(15, 23, 42, 0.045);
    }


    /* =========================================
       FILTER CHIPS
    ========================================= */

    .filters {
      display: flex;

      flex-wrap: wrap;

      gap: 8px;

      margin-bottom: 22px;
    }


    .chip {
      padding: 9px 14px;

      color: #667085;

      background: white;

      border: 1px solid var(--border);

      border-radius: 999px;

      font-family: inherit;

      font-size: 12px;
      font-weight: 700;

      cursor: pointer;

      transition: all 0.2s ease;
    }


    .chip:hover {
      color: var(--text);

      border-color: #b9c4d4;

      transform: translateY(-1px);
    }


    .chip.is-active {
      color: white;

      background: var(--text);

      border-color: var(--text);
    }


    /* =========================================
       TASK LIST
    ========================================= */

    .tasks {
      display: grid;

      gap: 12px;

      padding: 0;
      margin: 0;

      list-style: none;
    }


    .tasks > li {
      padding: 18px;

      background: white;

      border: 1px solid var(--border);

      border-radius: 16px;

      box-shadow:
        0 7px 20px rgba(15, 23, 42, 0.045);

      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        border-color 0.18s ease;
    }


    .tasks > li:hover {
      transform: translateY(-2px);

      border-color: #d2d9e4;

      box-shadow:
        0 13px 28px rgba(15, 23, 42, 0.08);
    }


    /* =========================================
       EMPTY STATE
    ========================================= */

    .empty {
      margin: 70px auto 20px;

      color: var(--muted);

      text-align: center;

      font-size: 14px;
    }


    /* =========================================
       ERROR MESSAGE
    ========================================= */

    .error {
      padding: 11px 13px;

      margin-bottom: 14px;

      color: var(--danger);

      background: #fff1f2;

      border: 1px solid #fecaca;

      border-radius: 11px;

      font-size: 12px;
      font-weight: 700;
    }


    /* =========================================
       RESPONSIVE — TABLET
    ========================================= */

    @media (max-width: 800px) {

      .topbar {
        padding: 0 18px;
      }


      main {
        width: min(100% - 22px, 680px);

        padding-top: 28px;
      }


      .board {
        grid-template-columns: 1fr;

        gap: 18px;
      }


      .panel {
        position: static;
      }


      .list-area {
        padding: 18px;
      }
    }


    /* =========================================
       RESPONSIVE — MOBILE
    ========================================= */

    @media (max-width: 480px) {

      .topbar {
        height: 68px;
      }


      .topbar h1 {
        font-size: 18px;
      }


      #user-name {
        display: none;
      }


      main {
        width: calc(100% - 20px);

        padding-top: 20px;
      }


      .auth {
        margin-top: 3vh;

        padding: 23px;

        border-radius: 20px;
      }


      .panel {
        padding: 20px;
      }


      .list-area {
        padding: 15px;
      }


      .filters {
        gap: 6px;
      }


      .chip {
        padding: 8px 12px;
      }
    }

  </style>
</head>


<body>

  <!-- =========================================
       HEADER
  ========================================= -->

  <header class="topbar">

    <h1>
      CEA Task Board
    </h1>


    <div
      id="userbar"
      class="userbar"
      hidden
    >

      <span id="user-name"></span>


      <button
        id="logout-btn"
        class="btn btn-quiet"
        type="button"
      >
        Log out
      </button>

    </div>

  </header>


  <main>

    <!-- =========================================
         LOGIN / SIGNUP
    ========================================= -->

    <section
      id="auth-view"
      class="auth"
      hidden
    >

      <div
        class="auth-tabs"
        role="tablist"
      >

        <button
          id="tab-login"
          class="tab is-active"
          role="tab"
          type="button"
        >
          Log in
        </button>


        <button
          id="tab-signup"
          class="tab"
          role="tab"
          type="button"
        >
          Create account
        </button>

      </div>


      <div
        id="auth-error"
        class="error"
        role="alert"
        hidden
      ></div>


      <form
        id="auth-form"
        class="form"
        novalidate
      >

        <label
          id="name-field"
          for="auth-name"
          hidden
        >

          Name

          <input
            id="auth-name"
            type="text"
            autocomplete="name"
            maxlength="50"
          />

        </label>


        <label for="auth-email">

          Email

          <input
            id="auth-email"
            type="email"
            autocomplete="email"
          />

        </label>


        <label for="auth-password">

          Password

          <input
            id="auth-password"
            type="password"
            autocomplete="current-password"
          />

        </label>


        <p
          id="password-hint"
          class="hint"
          hidden
        >
          At least 8 characters, with a letter and a number.
        </p>


        <button
          id="auth-submit"
          class="btn btn-primary"
          type="submit"
        >
          Log in
        </button>

      </form>

    </section>


    <!-- =========================================
         TASK BOARD
    ========================================= -->

    <section
      id="app-view"
      class="board"
      hidden
    >

      <!-- TASK CREATION PANEL -->

      <aside class="panel">

        <h2 id="form-title">
          New task
        </h2>


        <div
          id="task-error"
          class="error"
          role="alert"
          hidden
        ></div>


        <form
          id="task-form"
          class="form"
          novalidate
        >

          <label for="task-title">

            Title

            <input
              id="task-title"
              type="text"
              maxlength="100"
            />

          </label>


          <label for="task-desc">

            Description

            <textarea
              id="task-desc"
              rows="3"
              maxlength="500"
            ></textarea>

          </label>


          <label for="task-status">

            Status

            <select id="task-status">

              <option value="todo">
                To do
              </option>

              <option value="in-progress">
                In progress
              </option>

              <option value="done">
                Done
              </option>

            </select>

          </label>


          <label for="task-due">

            Due date

            <input
              id="task-due"
              type="date"
            />

          </label>


          <div class="row">

            <button
              id="task-save"
              class="btn btn-primary"
              type="submit"
            >
              Add task
            </button>


            <button
              id="task-cancel"
              class="btn btn-quiet"
              type="button"
              hidden
            >
              Cancel
            </button>

          </div>

        </form>

      </aside>


      <!-- TASK LIST -->

      <div class="list-area">

        <div
          class="filters"
          id="filters"
        >

          <button
            class="chip is-active"
            data-filter=""
            type="button"
          >
            All
          </button>


          <button
            class="chip"
            data-filter="todo"
            type="button"
          >
            To do
          </button>


          <button
            class="chip"
            data-filter="in-progress"
            type="button"
          >
            In progress
          </button>


          <button
            class="chip"
            data-filter="done"
            type="button"
          >
            Done
          </button>

        </div>


        <ul
          id="task-list"
          class="tasks"
        ></ul>


        <p
          id="empty"
          class="empty"
          hidden
        ></p>

      </div>

    </section>

  </main>


  <!-- =========================================
       EXISTING JAVASCRIPT
  ========================================= -->

  <script src="app.js"></script>

</body>

</html>
